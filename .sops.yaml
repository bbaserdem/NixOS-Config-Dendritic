creation_rules:
  #---GLOBAL---#
  # Everyone
  - path_regex: ^secrets/(assets/)?[^/]+\.(yaml|json|key|bin)$
    key_groups:
    - age:
      - *user_wolframite
      - *user_ben-abuyah
      - *host_su-ana
      - *host_yel-ana
      - *host_yertengri
      - *host_od-ata
